parameters:
    app.elevation_cache_dir: '%kernel.project_dir%/var/elevation'
    app.landcover_cache_dir: '%kernel.project_dir%/var/landcover'
    app.bdforet_path: '%env(default:app.bdforet_default_path:BDFORET_PATH)%'
    app.bdforet_default_path: '%kernel.project_dir%/var/bdforet/formation-vegetale.geojsonl'
    app.geologie_path: '%env(default:app.geologie_default_path:GEOLOGIE_PATH)%'
    app.geologie_default_path: '%kernel.project_dir%/var/geologie/formations.geojsonl'
    app.tcd_path: '%env(default:app.tcd_default_path:TCD_PATH)%'
    app.tcd_default_path: '%kernel.project_dir%/var/tcd/canopy-cover.json'
    app.lidar_path: '%env(default:app.lidar_default_path:LIDAR_PATH)%'
    app.lidar_default_path: '%kernel.project_dir%/var/lidar/canopy-height.json'
    app.rge_alti_path: '%env(default:app.rge_alti_default_path:RGE_ALTI_PATH)%'
    app.rge_alti_default_path: '%kernel.project_dir%/var/elevation/rge-alti.json'
    app.soilph_path: '%env(default:app.soilph_default_path:SOILPH_PATH)%'
    app.soilph_default_path: '%kernel.project_dir%/var/soilph/soil-ph.json'
    app.elevation_zoom: 13
    app.area.name: 'Grenoble — Chartreuse, Belledonne, Vercors'
    app.area.south: 44.72
    app.area.west: 5.38
    app.area.north: 45.45
    app.area.east: 6.30
    app.area.center_lat: 45.19
    app.area.center_lng: 5.79
    app.area.zoom: 11
    app.area.cell_size: 50

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/**/{Coordinates,BoundingBox,Grid,GridWindow,SurveyArea,TerrainProfile,Exposure,ForestPolygon,GeologyPolygon,WaterFeature,AccessWay,AccessWalk,StandCode,Species,HarvestWindow,AltitudeBand,SlopeBand,CanopyDensityBand,CanopyHeightBand,PhBand,CriterionScore,SuitabilityScore,SeasonAssessment,FlushClock,WeatherConditions,WeatherField,LayerLegend}.php'
            - '../src/Application/Cartography/{LayerGridQuery,LayerGridView}.php'
            - '../src/Application/Precomputation/PrecomputationReport.php'
            - '../src/Kernel.php'

    App\Domain\Geo\SurveyArea:
        arguments:
            $name: '%app.area.name%'
            $bounds: '@app.area.bounds'
            $defaultCenter: '@app.area.center'
            $defaultZoom: '%app.area.zoom%'
            $cellSizeMeters: '%app.area.cell_size%'

    app.area.bounds:
        class: App\Domain\Geo\BoundingBox
        arguments:
            $south: '%app.area.south%'
            $west: '%app.area.west%'
            $north: '%app.area.north%'
            $east: '%app.area.east%'

    app.area.center:
        class: App\Domain\Geo\Coordinates
        arguments:
            $latitude: '%app.area.center_lat%'
            $longitude: '%app.area.center_lng%'

    App\Infrastructure\Elevation\TerrariumTileElevation:
        arguments:
            $cacheDirectory: '%app.elevation_cache_dir%'
            $zoom: '%app.elevation_zoom%'

    # Outside kernel.cache_dir so OSM tiles survive cache:clear and keep precompute offline.
    cache.overpass:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            $namespace: overpass
            $defaultLifetime: 0
            $directory: '%kernel.project_dir%/var/overpass'

    App\Infrastructure\LandCover\OverpassLandCover:
        arguments:
            $cache: '@cache.overpass'
            $legacyCacheDirectory: '%app.landcover_cache_dir%'

    # Uses BD Forêt when the converted dataset is present and falls back to OSM otherwise,
    # so a fresh clone precomputes without requiring an IGN download. Water always from OSM.
    App\Infrastructure\LandCover\BdForetLandCover:
        arguments:
            $fallback: '@App\Infrastructure\LandCover\OverpassLandCover'
            $datasetPath: '%app.bdforet_path%'

    App\Infrastructure\Geology\Charm50Geology:
        arguments:
            $datasetPath: '%app.geologie_path%'

    App\Infrastructure\Raster\TreeCoverDensityRaster:
        arguments:
            $datasetPath: '%app.tcd_path%'

    App\Infrastructure\Raster\LidarHdCanopyHeightRaster:
        arguments:
            $datasetPath: '%app.lidar_path%'

    App\Infrastructure\Raster\EcoDataCubeSoilPhRaster:
        arguments:
            $datasetPath: '%app.soilph_path%'

    App\Infrastructure\Elevation\RgeAltiElevation:
        arguments:
            $datasetPath: '%app.rge_alti_path%'

    App\Infrastructure\Elevation\CompositeElevationSampler:
        arguments:
            $preferred: '@App\Infrastructure\Elevation\RgeAltiElevation'
            $fallback: '@App\Infrastructure\Elevation\TerrariumTileElevation'

    App\Domain\Terrain\ElevationSampler: '@App\Infrastructure\Elevation\CompositeElevationSampler'
    App\Domain\Terrain\LandCoverSource: '@App\Infrastructure\LandCover\BdForetLandCover'
    App\Domain\Terrain\GeologySource: '@App\Infrastructure\Geology\Charm50Geology'
    App\Domain\Terrain\CanopyCoverSource: '@App\Infrastructure\Raster\TreeCoverDensityRaster'
    App\Domain\Terrain\CanopyHeightSource: '@App\Infrastructure\Raster\LidarHdCanopyHeightRaster'
    App\Domain\Terrain\SoilPhSource: '@App\Infrastructure\Raster\EcoDataCubeSoilPhRaster'
    App\Domain\Terrain\TerrainCellStore: '@App\Infrastructure\Persistence\DbalTerrainCellStore'
    App\Domain\Weather\WeatherSource: '@App\Infrastructure\Weather\OpenMeteoWeather'
    App\Domain\Mycology\SpeciesCatalog: '@App\Infrastructure\Mycology\InMemorySpeciesCatalog'
