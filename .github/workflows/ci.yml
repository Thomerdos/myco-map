name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Symfony
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, sqlite3, pdo_sqlite, curl, mbstring, xml, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Installer les dépendances
        working-directory: backend
        run: composer install --no-interaction --no-progress

      - name: Préparer la configuration
        working-directory: backend
        run: cp .env.example .env

      - name: Vérifier le conteneur de services
        working-directory: backend
        run: php bin/console lint:container

      - name: Vérifier la configuration YAML
        working-directory: backend
        run: php bin/console lint:yaml config

      - name: Vérifier que la base précalculée se restaure
        run: |
          chmod +x dev.sh
          ./dev.sh restore-data
          php -r '$db = new PDO("sqlite:backend/var/data/myco.sqlite");
            $count = (int) $db->query("SELECT COUNT(*) FROM terrain_cell")->fetchColumn();
            if ($count < 500000) { fwrite(STDERR, "Base incomplète: $count mailles\n"); exit(1); }
            echo "Base valide: $count mailles\n";'

  frontend:
    name: Frontend Vue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérifier les types et construire
        working-directory: frontend
        run: npm run build
